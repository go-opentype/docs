# go-opentype docs documentation — Hugo + Hextra, built like go-plot/docs and
# go-ndarray/docs.
#
# Each documentation version is a separate build under
# https://go-opentype.github.io/docs/<version>/, where <version> is the minor version of the
# code the pages describe, or "main" while no release is tagged. The CI sets it
# through --baseURL, from params.docs.version below; this default is the same
# build.
#
# ⛔ What this replaced was MkDocs Material plus mike, which needed a Python
# toolchain, a requirements.txt and a pip install in CI to render a static site
# for a pure-Go organisation.
# ⛔ The MkDocs site was published by mike as version 0.1 (alias latest). Keeping
# the label 0.1 (params.docs.version below: v0.1.0 -> 0.1) makes this build
# replace /docs/0.1/ in place, so every old URL keeps answering, and "latest"
# keeps pointing at it. With the label "main" the newest release directory on
# gh-pages would still be the stale MkDocs 0.1 and latest would never move.
baseURL: "https://go-opentype.github.io/docs/0.1/"
title: "go-opentype docs"
# ⛔ No languageCode: deprecated in Hugo 0.158 in favour of locale, and the
# languages block below already says which language this is. The second
# deprecation the pilot build refused, after cascade._target — both inherited
# from copying an older site in this fleet.

# themes/hextra is the tannevaled/hextra fork, pinned at a release tag as a
# submodule: upstream Hextra plus opt-in features (partial menu items, combos,
# related-sites menu, page subtitle and history, darkreaderLock).
theme: hextra

defaultContentLanguage: en
defaultContentLanguageInSubdir: false

# Flags: lipis/flag-icons 4x3 (MIT, static/images/flags/LICENSE).
languages:
  en:
    label: "English"
    contentDir: content/en
    weight: 1
    params:
      flag: images/flags/gb.svg
  zh-cn:
    label: "简体中文"
    contentDir: content/zh-cn
    weight: 2
    params:
      flag: images/flags/cn.svg
      description: "纯 Go、零依赖的 TrueType/OpenType 文本栈：字体解析与光栅化、Unicode 双向文本、复杂文本整形、内置易读字体。"
  ko:
    label: "한국어"
    contentDir: content/ko
    weight: 3
    params:
      flag: images/flags/kr.svg
      description: "순수 Go로 작성한 의존성 없는 TrueType/OpenType 텍스트 스택: 글꼴 파싱과 래스터화, 유니코드 양방향 텍스트, 복잡한 텍스트 셰이핑, 읽기 쉬운 내장 글꼴."
  ja:
    label: "日本語"
    contentDir: content/ja
    weight: 4
    params:
      flag: images/flags/jp.svg
      description: "純粋な Go で書かれた依存関係のない TrueType/OpenType テキストスタック：フォントの解析とラスタライズ、Unicode 双方向テキスト、複雑なテキストのシェーピング、読みやすい同梱フォント。"

# Word counts and summaries of the CJK pages count characters, not spaces.
hasCJKLanguage: true

enableRobotsTXT: true
# Git history dates every page: "Last updated on" at the foot of each one.
enableGitInfo: true

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      # ⛔ CJK line breaks: a soft line break between two East Asian characters
      # must not become a space (Chinese, Japanese), while between Korean words
      # it must (Korean is written with spaces). css3draft does both; "simple"
      # glues Korean words together.
      cjk:
        enable: true
        eastAsianLineBreaks: true
        eastAsianLineBreaksStyle: css3draft
    parser:
      attribute:
        title: true
        # ⛔ Block attributes, because every converted heading carries an
        # explicit id — "## Heading {#the-mkdocs-slug}". The two slug rules
        # disagree: Python-Markdown drops an em dash and collapses the gap it
        # leaves into ONE hyphen, goldmark keeps one hyphen per space. An
        # anchor is a URL somebody may have saved, so the old spelling is
        # kept. Without this setting the braces are printed as text.
        block: true
  highlight:
    noClasses: false

# ⛔ The content is NOT under content/en/docs. This site is served AT /docs/,
# so a "docs" section would make every page /docs/docs/… . Hextra picks its
# documentation layout from the section being called "docs", so with the
# content at the root the type is cascaded instead.
# ⛔ "target", not "_target": the underscored spelling was deprecated in Hugo
# 0.156 and the fleet's older Hextra sites still carry it, so copying one of
# them is how a converted site arrives with a deprecation. The build runs with
# --panicOnWarning, which is what caught this on the first pilot.
cascade:
  - target:
      path: "/**"
    params:
      type: docs

# The search box in the navbar (a site with no entry of type "search" has none).
menu:
  main:
    - name: Search
      weight: 1
      params:
        type: search

params:
  # FlexSearch over the page contents. Chinese, Japanese and Korean text is
  # indexed as pairs of characters (hextra v0.23.0, flexsearch.cjk).
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward
  docs:
    version: "v0.1.0"
  description: "A pure-Go, zero-dependency TrueType/OpenType text stack: font parsing + rasterisation, Unicode bidi, complex-text shaping, bundled legible fonts."
  # The language switch (foot of the sidebar) shows the translate icon, then
  # the language's flag.
  languageSwitch:
    icon: translate
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: assets/logo.svg
      dark: assets/logo.svg
      width: 32
      height: 32
  theme:
    default: system
    displayToggle: true
  footer:
    enable: true
    displayCopyright: false
    displayPoweredBy: false
  page:
    width: normal
  editURL:
    enable: true
    base: "https://github.com/go-opentype/docs/edit/main/content"
